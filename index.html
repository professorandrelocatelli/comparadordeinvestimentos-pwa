    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');

                                    <select id="rateUnitB" class="block w-1/3 rounded-md border border-gray-300 shadow-sm p-3 bg-gray-50" disabled>

                <div class="bg-white p-4 rounded-md shadow-sm mb-4">

                <div class="bg-white p-4 rounded-md shadow-lg mb-6">

                <button id="resetButton" class="w-full bg-white hover:bg-gray-100 text-gray-700 border-2 border-gray-300 font-bold py-3 rounded-lg shadow-sm transition flex items-center justify-center gap-2">
                    LIMPAR E RECALCULAR

    </div>

    <div class="whatsapp-float">
        <a href="https://wa.me/5534991908166" target="_blank" class="whatsapp-button w-16 h-16 rounded-full flex items-center justify-center text-white text-3xl mb-1">
            <svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" fill="currentColor" viewBox="0 0 16 16"><path d="M13.601 2.326A7.854 7.854 0 0 0 7.994 0C3.627 0 .068 3.558.064 7.925c0 1.399.366 2.76.957 3.966L.043 16l4.205-1.382a7.927 7.927 0 0 0 3.793.999h.001c4.366 0 7.923-3.558 7.922-7.926-.001-2.45-1.04-4.708-2.83-6.38a7.725 7.725 0 0 0-5.794-2.12zm-4.79 3.58a.59.59 0 0 1 .32.06c.15.066.388.196.592.383.211.205.342.484.426.657.087.173.396.262.613.084.218.174.457.174.475 0 .017-.1.085-.205.215-.105.13-.23.272-.34.397-.1.125-.23.238-.363.342-.134.103-.26.216-.39.34a.573.573 0 0 1-.365.176c-.052 0-.11-.005-.17-.017s-.125-.044-.19-.08c-.066-.037-.145-.09-.232-.162-.089-.074-.187-.175-.296-.29-.11-.115-.224-.265-.333-.423s-.217-.35-.308-.528c-.09-.177-.167-.376-.234-.6s-.11-.47-.11-.748c0-.3.125-.563.224-.658.1-.096.225-.16.376-.23s.28-.15.44-.22c.16-.067.33-.12.51-.174s.344-.08.52-.08zM14.4 7.925c0 3.197-2.61 5.808-5.808 5.808-1.577 0-3.076-.636-4.181-1.751L2.923 13.92l.858-2.731c-1.161-1.222-1.802-2.822-1.802-4.593 0-3.198 2.61-5.808 5.808-5.808s5.808 2.61 5.808 5.808z"/></svg>

    <script>
        // CONFIGURAÇÃO API
        const GEMINI_API_KEY = "AIzaSyB_SRq8smqoxpZsLtfguQmfDGPaOBx-Agk"; 
        
        const formatCurrency = (val) => new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(val);
        let investmentChart = null; 

        // --- LÓGICA DE REGISTRO PWA ---
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./service-worker.js')
                    .then(reg => console.log('Service Worker registrado:', reg.scope))
                    .catch(err => console.log('Falha no Service Worker:', err));
            });
        }

        // --- CÁLCULOS ---
        function calculateMontante(P, i, t) {
            const factor = 1 + (i / 100);
            return P * Math.pow(factor, t);
        }

        function calculateGrowthData(P, i, t) {
            const factor = 1 + (i / 100);
            let currentBalance = P;
            const data = [{ step: 0, balance: P }];
            const labels = ['0M'];
            for (let step = 1; step <= t; step++) {
                currentBalance *= factor;
                data.push({ step: step, balance: currentBalance });
                labels.push(step + 'M');
            }
            return { balances: data.map(d => d.balance), labels: labels, totalSteps: t, finalBalance: currentBalance };
        }

        // --- GERAÇÃO IA E FALLBACK ---
        function generateRandomScenario() {
            const rand = (min, max) => (Math.random() * (max - min) + min);
            const randInt = (min, max) => Math.floor(rand(min, max));
            const invA = { principal: randInt(500, 15000), rate: parseFloat(rand(0.6, 1.5).toFixed(4)), rateUnit: 'month', time: randInt(12, 60), timeUnit: 'month' };
            const invB = { principal: randInt(500, 15000), rate: parseFloat(rand(1.0, 1.8).toFixed(4)), rateUnit: 'month', time: randInt(12, 60), timeUnit: 'month' };
            return { invA, invB };
        }
        
        async function generateScenarioWithAI() {
            let textResponse; 
            let scenario;

            if (!GEMINI_API_KEY || GEMINI_API_KEY.length < 20) {
                 scenario = generateRandomScenario();
                 fillInputs(scenario);
                 document.getElementById('aiStatus').textContent = "⚠️ ERRO: Chave API ausente. Gerando cenário ALEATÓRIO.";
                 document.getElementById('aiStatus').className = "text-sm text-orange-600 mt-3 font-bold";
                 return;
            }

            const btn = document.getElementById('btnGenerateAI');
            const loader = document.getElementById('aiLoader');
            const icon = document.getElementById('aiIcon');
            const status = document.getElementById('aiStatus');
            const btnText = document.getElementById('aiButtonText');

            btn.disabled = true;
            loader.style.display = 'block';
            icon.style.display = 'none';
            btnText.textContent = "IA Pensando...";
            status.textContent = "Conectando ao Google Gemini...";
            status.className = "text-sm text-indigo-600 mt-3 font-semibold animate-pulse";

            const prompt = `Aja como um professor especialista em matemática financeira. Crie 2 opções de investimentos (A e B). Valores numéricos puros. Use valores realistas do Brasil. Taxas AO MÊS. Tempo em MESES. Retorne JSON puro: { "invA": { "principal": 1000, "rate": 1.2, "rateUnit": "month", "time": 12, "timeUnit": "month" }, "invB": { "principal": 1500, "rate": 1.45, "rateUnit": "month", "time": 18, "timeUnit": "month" } }`;

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${GEMINI_API_KEY}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                });

                if (!response.ok) { throw new Error('Erro na API'); }

                const data = await response.json();
                textResponse = data.candidates[0].content.parts[0].text.replace(/```json/g, '').replace(/```/g, '').trim();
                const jsonStartIndex = textResponse.indexOf('{');
                const jsonEndIndex = textResponse.lastIndexOf('}') + 1;
                
                if(jsonStartIndex !== -1 && jsonEndIndex !== -1) {
                    textResponse = textResponse.substring(jsonStartIndex, jsonEndIndex);
                    scenario = JSON.parse(textResponse);
                    fillInputs(scenario);
                    status.textContent = "✅ Cenário gerado com sucesso pela IA! Clique em Calcular.";
                    status.className = "text-sm text-green-600 mt-3 font-bold";
                } else { throw new Error('JSON inválido'); }

            } catch (error) {
                console.error("Erro:", error);
                scenario = generateRandomScenario();
                fillInputs(scenario);
                status.textContent = `⚠️ ERRO na IA. Gerando cenário ALEATÓRIO OFFLINE.`;
                status.className = "text-sm text-orange-600 mt-3 font-bold";
            } finally {
                btn.disabled = false;
                loader.style.display = 'none';
                icon.style.display = 'inline';
                btnText.textContent = "Gerar Cenário";
                document.getElementById('resultsArea').classList.add('hidden');
            }
        }
        
        function fillInputs(scenario) {
            // Converte se a IA errar e mandar anual
            if (scenario.invA.rateUnit === 'year') { scenario.invA.rate = ((Math.pow(1 + scenario.invA.rate / 100, 1/12) - 1) * 100); }
            if (scenario.invA.timeUnit === 'year') { scenario.invA.time *= 12; }
            if (scenario.invB.rateUnit === 'year') { scenario.invB.rate = ((Math.pow(1 + scenario.invB.rate / 100, 1/12) - 1) * 100); }
            if (scenario.invB.timeUnit === 'year') { scenario.invB.time *= 12; }
            
            document.getElementById('principalInputA').value = scenario.invA.principal;
            document.getElementById('rateInputA').value = scenario.invA.rate.toFixed(4);
            document.getElementById('timeInputA').value = Math.round(scenario.invA.time); 
            document.getElementById('principalInputB').value = scenario.invB.principal;
            document.getElementById('rateInputB').value = scenario.invB.rate.toFixed(4);
            document.getElementById('timeInputB').value = Math.round(scenario.invB.time); 
        }

        // --- RESULTADOS E GRÁFICO ---
        function generateResultText(forCopy = false) {
            const PA = parseFloat(document.getElementById('principalInputA').value);
            const iA = parseFloat(document.getElementById('rateInputA').value);
            const tA = parseFloat(document.getElementById('timeInputA').value);
            const PB = parseFloat(document.getElementById('principalInputB').value);
            const iB = parseFloat(document.getElementById('rateInputB').value);
            const tB = parseFloat(document.getElementById('timeInputB').value);
            
            const finalA = calculateMontante(PA, iA, tA);
            const finalB = calculateMontante(PB, iB, tB);
            
            const winnerMsg = document.getElementById('winnerMessage').textContent;
            const explanation = document.getElementById('comparisonExplanation').textContent;

            return `MÉTODO ZERO CHUTE\n\nRESULTADO:\n${winnerMsg}\n${explanation}\n\nINV A: P=${formatCurrency(PA)}, i=${iA}%, t=${tA}m -> FINAL: ${formatCurrency(finalA)}\nINV B: P=${formatCurrency(PB)}, i=${iB}%, t=${tB}m -> FINAL: ${formatCurrency(finalB)}`;
        }

        async function copyResults() {
            try { await navigator.clipboard.writeText(generateResultText(true)); alert('Copiado!'); } 
            catch (err) { alert('Erro ao copiar.'); }
        }

        function downloadResults() {
            const element = document.createElement('a');
            element.setAttribute('href', 'data:text/plain;charset=utf-8,' + encodeURIComponent(generateResultText()));
            element.setAttribute('download', "Analise_ZeroChute.txt");
            element.style.display = 'none';
            document.body.appendChild(element);
            element.click();
            document.body.removeChild(element);
        }

        function runSimulation() {
            const getVal = (id) => parseFloat(document.getElementById(id).value);
            const PA = getVal('principalInputA'), iA = getVal('rateInputA'), tA = getVal('timeInputA');
            const PB = getVal('principalInputB'), iB = getVal('rateInputB'), tB = getVal('timeInputB');

            if ([PA, iA, tA, PB, iB, tB].some(v => isNaN(v) || v <= 0)) { alert("Preencha valores válidos."); return; }

            const growthA = calculateGrowthData(PA, iA, tA);
            const growthB = calculateGrowthData(PB, iB, tB);
            const finalA = growthA.finalBalance;
            const finalB = growthB.finalBalance;
            const diff = finalA - finalB;
            
            const resArea = document.getElementById('resultsArea');
            resArea.classList.remove('hidden', 'border-blue-500', 'border-red-500', 'border-gray-400');
            document.getElementById('resultA').className = "p-4 rounded border bg-white";
            document.getElementById('resultB').className = "p-4 rounded border bg-white";

            let winner, loser, wFinal, lFinal;

            if (Math.abs(diff) < 0.01) {
                document.getElementById('winnerMessage').textContent = "⚖️ Empate técnico!";
                document.getElementById('winnerMessage').className = "text-lg font-bold text-gray-700";
                resArea.classList.add('border-gray-400');
                winner = 'Ambos';
            } else if (finalA > finalB) {
                document.getElementById('winnerMessage').textContent = "🏆 Investimento A venceu!";
                document.getElementById('winnerMessage').className = "text-lg font-bold text-blue-700";
                resArea.classList.add('border-blue-500');
                document.getElementById('resultA').classList.add('border-blue-500', 'bg-blue-50');
                winner = 'Investimento A'; loser = 'Investimento B'; wFinal = finalA; lFinal = finalB;
            } else {
                document.getElementById('winnerMessage').textContent = "🏆 Investimento B venceu!";
                document.getElementById('winnerMessage').className = "text-lg font-bold text-red-700";
                resArea.classList.add('border-red-500');
                document.getElementById('resultB').classList.add('border-red-500', 'bg-red-50');
                winner = 'Investimento B'; loser = 'Investimento A'; wFinal = finalB; lFinal = finalA;
            }

            document.getElementById('valueA').textContent = formatCurrency(finalA);
            document.getElementById('valueB').textContent = formatCurrency(finalB);
            
            document.getElementById('detailedAnalysis').innerHTML = `<h6 class="font-bold border-b pb-1">Juros:</h6><p>A: <strong class="text-green-600">${formatCurrency(finalA - PA)}</strong></p><p>B: <strong class="text-green-600">${formatCurrency(finalB - PB)}</strong></p>`;

            if (winner !== 'Ambos') {
                document.getElementById('comparisonExplanation').innerHTML = `<h6 class="font-bold mb-2">Conclusão</h6><p>O <strong>${winner}</strong> superou o ${loser} em <strong>${formatCurrency(Math.abs(diff))}</strong>.</p>`;
            } else {
                document.getElementById('comparisonExplanation').innerHTML = `<p>Resultados idênticos.</p>`;
            }

            if (investmentChart) { investmentChart.destroy(); }
            const chartLabels = growthA.totalSteps > growthB.totalSteps ? growthA.labels : growthB.labels;
            const dataB_padded = [...growthB.balances];
            while (dataB_padded.length < chartLabels.length) { dataB_padded.push(growthB.finalBalance); }

            const ctx = document.getElementById('investmentChart').getContext('2d');
            investmentChart = new Chart(ctx, {
                type: 'line', 
                data: {
                    labels: chartLabels,
                    datasets: [
                        { label: 'Investimento A', data: growthA.balances, borderColor: 'rgb(59, 130, 246)', backgroundColor: 'rgba(59, 130, 246, 0.1)', fill: true, tension: 0.3 },
                        { label: 'Investimento B', data: dataB_padded, borderColor: 'rgb(239, 68, 68)', backgroundColor: 'rgba(239, 68, 68, 0.1)', fill: true, tension: 0.3 }
                    ]
                },
                options: { responsive: true, plugins: { legend: { position: 'bottom' } }, scales: { y: { ticks: { callback: (v) => 'R$' + v.toLocaleString('pt-BR', {maximumFractionDigits:0}) } } } }
            });
            
            resArea.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        document.getElementById('btnGenerateAI').addEventListener('click', generateScenarioWithAI);
        document.getElementById('simulateButton').addEventListener('click', runSimulation);
        document.getElementById('copyButton').addEventListener('click', copyResults);
        document.getElementById('downloadButton').addEventListener('click', downloadResults);
        document.getElementById('btnClearManual').addEventListener('click', () => {
            document.querySelectorAll('input').forEach(i => i.value = '');
            document.getElementById('resultsArea').classList.add('hidden');
            document.getElementById('aiStatus').textContent = ""; 
            if (investmentChart) investmentChart.destroy(); 
        });
        document.getElementById('resetButton').addEventListener('click', () => { document.getElementById('btnClearManual').click(); window.scrollTo({ top: 0, behavior: 'smooth' }); });
    </script>
</body>
